# In cloud mode the base Role is reduced to leader-election access. The Lease
# lives beside the operator in streamline-system; granting Lease access through
# the ClusterRole would unnecessarily cover every tenant namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: streamline-operator
  namespace: streamline-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
