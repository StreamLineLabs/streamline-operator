apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamline-operator
  namespace: streamline-system
spec:
  template:
    spec:
      containers:
        - name: operator
          args:
            - --leader-elect
            # An explicitly empty value selects WatchScope::AllNamespaces.
            - --namespace=
            - --metrics-bind-address=0.0.0.0:8080
            - --health-probe-bind-address=0.0.0.0:8081
