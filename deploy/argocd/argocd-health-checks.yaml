# Argo CD Resource Health Checks for Streamline CRDs
#
# Add this to your Argo CD ConfigMap (argocd-cm) to enable health checks
# for Streamline custom resources.
#
# Usage:
#   kubectl apply -f argocd-health-checks.yaml
#   # Or merge into your existing argocd-cm ConfigMap

apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
data:
  # Health checks for Streamline CRDs
  # Phases below are exactly the ClusterPhase variants in src/crd/cluster.rs;
  # tests/docs_examples.rs fails if they drift. The previous block tested for
  # "Provisioning" and "Error", which the CRD does not define, so those states
  # silently fell through to "Unknown".
  resource.customizations.health.streamline.io_StreamlineCluster: |
    hs = {}
    if obj.status ~= nil then
      if obj.status.phase == "Running" then
        hs.status = "Healthy"
        hs.message = "Cluster is running"
      elseif obj.status.phase == "Pending" or obj.status.phase == "Scaling"
          or obj.status.phase == "Upgrading" then
        hs.status = "Progressing"
        hs.message = "Cluster is " .. obj.status.phase
      elseif obj.status.phase == "Failed" then
        hs.status = "Degraded"
        hs.message = obj.status.errorMessage or "Cluster reconciliation failed"
      elseif obj.status.phase == "Terminating" then
        hs.status = "Progressing"
        hs.message = "Cluster is terminating"
      else
        hs.status = "Unknown"
      end
    else
      hs.status = "Progressing"
      hs.message = "Waiting for reconciliation"
    end
    return hs

  # Phases below are exactly the TopicPhase variants in src/crd/topic.rs.
  # A topic whose spec sets configuration the Streamline server does not apply
  # is rejected and reports "Failed", which surfaces here as Degraded.
  resource.customizations.health.streamline.io_StreamlineTopic: |
    hs = {}
    if obj.status ~= nil then
      if obj.status.phase == "Ready" then
        hs.status = "Healthy"
        hs.message = "Topic is ready"
      elseif obj.status.phase == "Pending" or obj.status.phase == "Updating" then
        hs.status = "Progressing"
        hs.message = "Topic is " .. obj.status.phase
      elseif obj.status.phase == "Failed" then
        hs.status = "Degraded"
        hs.message = obj.status.errorMessage or "Topic reconciliation failed"
      elseif obj.status.phase == "Terminating" then
        hs.status = "Progressing"
        hs.message = "Topic is terminating"
      else
        hs.status = "Unknown"
      end
    else
      hs.status = "Progressing"
      hs.message = "Waiting for reconciliation"
    end
    return hs

  # StreamlineUser is installed but unsupported: the Streamline server exposes
  # no user API, so the controller always publishes phase "Unsupported" and
  # creates nothing. Surfacing that as Degraded (rather than the previous
  # catch-all "Unknown") makes an Argo CD application that ships a
  # StreamlineUser fail visibly instead of appearing to converge. The phases
  # below are the ones src/crd/user.rs actually defines.
  resource.customizations.health.streamline.io_StreamlineUser: |
    hs = {}
    if obj.status ~= nil then
      if obj.status.phase == "Unsupported" then
        hs.status = "Degraded"
        hs.message = obj.status.errorMessage or
          "User management is not supported: the Streamline server exposes no user API"
      elseif obj.status.phase == "Ready" then
        hs.status = "Healthy"
        hs.message = "User is ready"
      elseif obj.status.phase == "Pending" or obj.status.phase == "Updating" then
        hs.status = "Progressing"
        hs.message = "User is " .. obj.status.phase
      elseif obj.status.phase == "Failed" then
        hs.status = "Degraded"
        hs.message = obj.status.errorMessage or "User reconciliation failed"
      else
        hs.status = "Unknown"
      end
    else
      hs.status = "Progressing"
      hs.message = "Waiting for reconciliation"
    end
    return hs

  # No health check for StreamlineBackup, StreamlineBranch, StreamlineContract,
  # StreamlineMemory, or StreamlineEdge: those CRDs are schema-only. Nothing
  # installs or reconciles them, so a customization for them would advertise
  # support this operator does not implement. See the README, "Schema-only
  # CRDs". tests/docs_examples.rs fails if one is re-added.

  # No resource actions.
  #
  # The previous `restart` action set `spec.restartAt`, which is not a field of
  # the StreamlineCluster schema. Structural CRD schemas prune unknown fields,
  # so the API server dropped it and the button did nothing while appearing to
  # work. Restart a cluster with `kubectl rollout restart statefulset/<name>`
  # until the CRD gains a real field for it.
