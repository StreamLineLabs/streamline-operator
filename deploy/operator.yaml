apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamline-operator
  namespace: streamline-system
  labels:
    app.kubernetes.io/name: streamline-operator
    app.kubernetes.io/part-of: streamline
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: streamline-operator
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: streamline-operator
        app.kubernetes.io/part-of: streamline
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: streamline-operator
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: operator
          image: ghcr.io/streamlinelabs/streamline-operator:0.3.0
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect
            # Watch only the namespace the operator runs in. This matches the
            # namespaced Role/RoleBinding in deploy/rbac; cluster-wide mode
            # (`--namespace=`) is packaged separately in overlays/cloud/.
            # Kubernetes expands $(VAR) in args from the container's env.
            - --namespace=$(OPERATOR_NAMESPACE)
            # Must be a full socket address: ":8080" does not parse and left
            # both auxiliary servers unbound, so the probes never answered.
            - --metrics-bind-address=0.0.0.0:8080
            - --health-probe-bind-address=0.0.0.0:8081
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "info,streamline_operator=debug"
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          # /readyz means "this operator process is healthy", which includes a
          # leader-election standby waiting for the Lease. Gating readiness on
          # leadership deadlocks rolling updates: the new pod would wait for
          # the lease the outgoing pod still holds, while the rollout waits for
          # the new pod to be ready. Use /leaderz (or the
          # `streamline_operator_leader` gauge) to find the active replica.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
