# Namespaced Role — the operator's default, least-privilege scope.
#
# This used to be a ClusterRole bound cluster-wide. The operator only ever
# watched (and could only be authorised for) resources it actually reconciles,
# and the shipped Deployment now passes `--namespace=$(OPERATOR_NAMESPACE)`, so
# cluster-scoped permissions granted reach the operator never used and could
# not justify.
#
# Cluster-wide mode (`--namespace=` with an empty value) is packaged as the
# opt-in overlays/cloud/ Kustomize overlay. Its ClusterRole carries these
# reconciliation rules while Lease access remains namespaced.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: streamline-operator
  namespace: streamline-system
  labels:
    app.kubernetes.io/name: streamline-operator
    app.kubernetes.io/part-of: streamline
rules:
  # -----------------------------------------------------------
  # Streamline CRDs (streamline.io/v1alpha1)
  # Exactly the resources this operator runs a controller for, matching the
  # CRDs installed by deploy/crds/kustomization.yaml.
  # The operator watches these resources and patches finalizers, but users or
  # the Cloud control plane create and delete them. It therefore has no
  # create/update/delete grant on the main resources.
  #
  # streamlinebranches, streamlinecontracts, streamlinememories,
  # streamlinebackups, and streamlineedges are intentionally absent: nothing
  # reconciles them, their CRDs are not installed, and granting access would
  # let a future controller start reconciling an API the Streamline server does
  # not expose. tests/crd_manifests.rs fails if this list and the generator's
  # reconciliation metadata disagree.
  # -----------------------------------------------------------
  - apiGroups: ["streamline.io"]
    resources:
      - streamlineclusters
      - streamlinetopics
      - streamlineusers
    verbs: ["get", "list", "watch", "patch"]

  # CRD status subresource — each controller updates .status
  - apiGroups: ["streamline.io"]
    resources:
      - streamlineclusters/status
      - streamlinetopics/status
      - streamlineusers/status
    verbs: ["patch"]

  # CRD finalizers — controllers add/remove finalizers for safe cleanup
  - apiGroups: ["streamline.io"]
    resources:
      - streamlineclusters/finalizers
      - streamlinetopics/finalizers
      - streamlineusers/finalizers
    verbs: ["update"]

  # -----------------------------------------------------------
  # StatefulSets (apps/v1)
  # ClusterController creates and manages StatefulSets for broker pods.
  # -----------------------------------------------------------
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  # -----------------------------------------------------------
  # Services (v1)
  # ClusterController creates headless and client-facing Services.
  # -----------------------------------------------------------
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  # -----------------------------------------------------------
  # ConfigMaps (v1)
  # ClusterController creates ConfigMaps for Streamline configuration.
  # -----------------------------------------------------------
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  # -----------------------------------------------------------
  # Secrets: NO ACCESS, deliberately.
  #
  # The operator never calls the Secret API. TLS keypairs and CA bundles named
  # by a StreamlineCluster are referenced from a SecretVolumeSource and read by
  # the kubelet on the broker's behalf, which needs no operator permission, and
  # user credentials are never provisioned (user management is unsupported —
  # see src/controllers/user.rs). The previous read/list/watch grant therefore
  # bought nothing and made a compromised operator a cluster-wide secret
  # reader.
  #
  # tests/static_manifests.rs fails if any shipped role mentions secrets.
  # -----------------------------------------------------------

  # -----------------------------------------------------------
  # PersistentVolumeClaims (v1)
  # ClusterController cleans up PVCs on cluster deletion.
  # -----------------------------------------------------------
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "delete"]

  # -----------------------------------------------------------
  # Pods (v1)
  # ClusterController reads pod status for health monitoring.
  # -----------------------------------------------------------
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  # -----------------------------------------------------------
  # Events (v1)
  # Allows the operator to emit Kubernetes events for observability.
  # -----------------------------------------------------------
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

  # -----------------------------------------------------------
  # HorizontalPodAutoscalers (autoscaling/v2)
  # The cluster controller deletes stale operator-owned HPAs on every
  # reconcile, so `delete` is required even though autoscaling is rejected.
  # -----------------------------------------------------------
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # -----------------------------------------------------------
  # Leases (coordination.k8s.io/v1)
  # Leader election for HA deployments. The Lease lives in the namespace the
  # operator runs in, which this Role covers; `--leader-election-namespace`
  # pointing elsewhere needs a Role/RoleBinding in that namespace.
  # -----------------------------------------------------------
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # -----------------------------------------------------------
  # Namespaces: NO ACCESS, deliberately.
  #
  # Namespaces are cluster-scoped and cannot be granted by a Role at all. The
  # operator does not need them: it reads its own namespace from the projected
  # service account token file (see leader_election::detect_namespace), and the
  # namespace it watches is passed with --namespace.
  # -----------------------------------------------------------
