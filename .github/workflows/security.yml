name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 7 * * 1'  # Weekly on Monday

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Advisories are the release blocker; the rest keep licence and source
        # policy honest without failing a release on a transitive duplicate.
        checks:
          - advisories
          - bans licenses sources
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}
